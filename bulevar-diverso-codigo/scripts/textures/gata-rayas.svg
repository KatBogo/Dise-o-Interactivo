    <rect x="0" y="420" width="1024" height="23"/>
    <rect x="0" y="466" width="1024" height="23"/>
  </g>
  <g fill="#1F9C8C">
    <rect x="0" y="351" width="1024" height="23"/>
    <rect x="0" y="397" width="1024" height="23"/>
    <rect x="0" y="443" width="1024" height="23"/>
    <rect x="0" y="489" width="1024" height="23"/>
  </g>
  <rect x="820" y="0" width="204" height="146" fill="#1E1E1E"/>
